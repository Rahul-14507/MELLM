<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELLM — Multi-Expert LLM Router</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root {
            --bg-main: #1a1a1a;
            --bg-sidebar: #141414;
            --bg-bubble: #2a2a2a;
            --accent: #00bcd4;
            --text-primary: #e0e0e0;
            --text-dim: #999;
            --border: #333;
            --user-bubble: #005a64;
            
            --color-code: #7c3aed;
            --color-math: #ea580c;
            --color-medical: #16a34a;
            --color-legal: #ca8a04;
            --color-general: #475569;
            --color-multi: #0891b2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            padding: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -1px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: #fff; }

        .panel-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 12px;
            margin-top: 24px;
        }

        .specialist-list { display: flex; flex-direction: column; gap: 10px; }
        .specialist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
        }
        .status-dot.active { background: #4caf50; box-shadow: 0 0 8px #4caf50; }
        .status-dot.cached { background: #fbc02d; }
        .status-dot.none { background: #444; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            font-size: 13px;
        }
        .stat-item {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .stat-label { color: var(--text-dim); font-size: 11px; display: block; margin-bottom: 2px; }
        .stat-value { font-weight: 600; font-family: monospace; color: var(--accent); }

        .btn-clear {
            margin-top: auto;
            background: transparent;
            border: 1px solid #444;
            color: var(--text-dim);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .btn-clear:hover { border-color: #666; color: #fff; background: #222; }

        /* Main Chat Area */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
            position: relative;
            word-wrap: break-word;
        }
        .user .bubble {
            background: var(--user-bubble);
            color: #fff;
            border-bottom-right-radius: 2px;
        }
        .assistant .bubble {
            background: var(--bg-bubble);
            color: var(--text-primary);
            border-bottom-left-radius: 2px;
            border: 1px solid var(--border);
        }

        .badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            width: fit-content;
            text-transform: uppercase;
        }
        .badge-code { background: var(--color-code); }
        .badge-math { background: var(--color-math); }
        .badge-medical { background: var(--color-medical); }
        .badge-legal { background: var(--color-legal); }
        .badge-general { background: var(--color-general); }
        .badge-multi-agent { background: var(--color-multi); }

        .metrics-bar {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 8px;
            display: flex;
            gap: 15px;
            font-family: monospace;
        }
        .metrics-bar span { display: flex; align-items: center; gap: 4px; }

        /* Input Bar */
        .input-area {
            padding: 20px;
            background: linear-gradient(transparent, var(--bg-main) 20%);
            border-top: 1px solid var(--border);
        }
        .input-container {
            max-width: 800px;
            margin: 0 auto;
            background: #252525;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }
        .input-container:focus-within { border-color: var(--accent); }

        textarea {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            max-height: 200px;
            outline: none;
        }
        .btn-send {
            background: var(--accent);
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            transition: transform 0.1s;
        }
        .btn-send:hover { transform: scale(1.05); }
        .btn-send:disabled { background: #444; cursor: not-allowed; }

        .btn-stop {
            background: #ff5252;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: none; /* hidden by default */
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
            transition: transform 0.1s;
        }
        .btn-stop:hover { transform: scale(1.05); background: #ff1744; }

        .regenerate-btn {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            margin-top: 8px;
            width: fit-content;
        }
        .regenerate-btn:hover { border-color: var(--accent); color: #fff; background: #222; }
        .regenerate-btn svg { opacity: 0.7; }

        /* Multi-agent parts */
        .multi-agent-container {
            width: 100%;
        }

        .multi-agent-header {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sub-agent-panels {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sub-agent-panel {
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            background: #1a1a1a;
        }

        .sub-agent-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            font-size: 12px;
        }

        .sub-agent-content {
            padding: 12px;
            min-height: 40px;
        }

        .sub-agent-status {
            color: #8b949e;
            font-size: 11px;
        }

        .domain-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            color: #fff;
        }
        .domain-code { background: var(--color-code); }
        .domain-math { background: var(--color-math); }
        .domain-medical { background: var(--color-medical); }
        .domain-legal { background: var(--color-legal); }
        .domain-general { background: var(--color-general); }

        /* Code block container */
        .code-block {
            position: relative;
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0d1117;
            border: 1px solid #30363d;
        }

        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            font-size: 12px;
            color: #8b949e;
            font-family: monospace;
        }

        .code-block-header .lang-label {
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
            color: #00bcd4;
        }

        .copy-btn {
            background: none;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            background: #21262d;
            color: #c9d1d9;
            border-color: #8b949e;
        }

        .copy-btn.copied {
            color: #3fb950;
            border-color: #3fb950;
        }

        .code-block pre {
            margin: 0;
            padding: 16px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            tab-size: 4;
        }

        .code-block code {
            font-family: inherit;
            white-space: pre;  /* preserve all whitespace including indentation */
        }

        /* Inline code */
        .bubble code:not(.hljs) {
            background: #1f2937;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
            color: #e2e8f0;
        }

        /* Loading Dots */
        .typing { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 6px; height: 6px; background: #666; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>
    <aside>
        <div class="logo">MELLM <span>Router</span></div>
        
        <div class="panel-title">Model Availability</div>
        <div id="specialist-status" class="specialist-list">
            <!-- Populated by JS -->
        </div>

        <div class="panel-title">Session Efficiency</div>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label">Total Queries</span>
                <span id="stat-queries" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Cache Hit Rate</span>
                <span id="stat-cache" class="stat-value">0%</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Router Loads Saved</span>
                <span id="stat-saved" class="stat-value">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Context Turns</span>
                <span id="stat-context" class="stat-value">0/0</span>
            </div>
        </div>

        <button class="btn-clear" onclick="App.clearContext()">Clear Context</button>
    </aside>

    <main>
        <div id="chat-container">
            <!-- Messages appear here -->
        </div>

        <div class="input-area">
            <div class="input-container">
                <textarea id="user-input" placeholder="Ask MELLM anything..." rows="1"></textarea>
                <button id="send-btn" class="btn-send" onclick="App.sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
                <button id="stop-btn" class="btn-stop" onclick="App.stopGeneration()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // 1. API Client
        const API = {
            async streamQuery(prompt, callbacks, signal) {
                const {onRouting, onLoaded, onToken, onMultiAgentStart, onSubAgentStart, onSubAgentLoaded, onSubAgentToken, onSubAgentDone, onDone, onError} = callbacks;
                try {
                    const response = await fetch('/query/stream', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({prompt}),
                        signal: signal
                    });
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const {done, value} = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, {stream: true});
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            try {
                                const event = JSON.parse(line.slice(6));
                                if (event.type === 'routing') onRouting(event);
                                else if (event.type === 'loaded') onLoaded(event);
                                else if (event.type === 'token') onToken(event);
                                else if (event.type === 'multi_agent_start') onMultiAgentStart(event);
                                else if (event.type === 'sub_agent_start') onSubAgentStart(event);
                                else if (event.type === 'sub_agent_loaded') onSubAgentLoaded(event);
                                else if (event.type === 'sub_agent_token') onSubAgentToken(event);
                                else if (event.type === 'sub_agent_done') onSubAgentDone(event);
                                else if (event.type === 'done') onDone(event);
                                else if (event.type === 'error') onError(event.message);
                            } catch (e) { console.error("Parse error", e); }
                        }
                    }
                } catch (e) { 
                    if (e.name === 'AbortError') onError('AbortError');
                    else onError(e.message); 
                }
            },

            async getStatus() {
                const r = await fetch('/status');
                return r.json();
            },

            async clearContext() {
                await fetch('/context', {method: 'DELETE'});
            }
        };

        // 2. UI Renderer
        const UI = {
            container: document.getElementById('chat-container'),
            input: document.getElementById('user-input'),
            sendBtn: document.getElementById('send-btn'),
            stopBtn: document.getElementById('stop-btn'),

            addUserMessage(text) {
                const msg = document.createElement('div');
                msg.className = 'message user';
                msg.innerHTML = `<div class="bubble message-content">${this.escapeHtml(text)}</div>`;
                this.container.appendChild(msg);
                this.scrollToBottom();
            },

            addTypingIndicator() {
                const id = 'msg-' + Date.now();
                const msg = document.createElement('div');
                msg.className = 'message assistant';
                msg.id = id;
                msg.innerHTML = `
                    <div class="bubble message-content">
                        <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                    </div>
                `;
                this.container.appendChild(msg);
                this.scrollToBottom();
                return id;
            },

            upgradeToBubble(id, domain) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                bubble.innerHTML = '';
                
                const badge = document.createElement('div');
                badge.className = `badge badge-${domain.toLowerCase().replace('_', '-')}`;
                badge.textContent = domain;
                msg.insertBefore(badge, bubble);
            },

            appendToken(id, token) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                
                // Track current state for code blocks
                if (!bubble.dataset.raw) bubble.dataset.raw = '';
                bubble.dataset.raw += token;

                // Robust markdown rendering on full accumulated text
                bubble.innerHTML = this.renderMarkdown(bubble.dataset.raw);
                
                // Highlight code blocks
                bubble.querySelectorAll('.code-block code:not(.hljs-highlighted)').forEach((block) => {
                    if (!block.textContent.includes('%%')) {  // skip placeholders
                        hljs.highlightElement(block);
                        block.classList.add('hljs-highlighted');
                    }
                });
                
                this.scrollToBottom();
            },

            finalizeMessage(id, event) {
                const msg = document.getElementById(id);
                if (!msg) return;

                const metrics = document.createElement('div');
                metrics.className = 'metrics-bar';
                
                const cacheIcon = event.cache_hit ? '♻' : '⚡';
                metrics.innerHTML = `
                    <span>Load: ${event.specialist_load_time.toFixed(2)}s ${cacheIcon}</span>
                    <span>Inference: ${event.inference_time_seconds.toFixed(2)}s</span>
                    <span>Context: ${event.context_turns} turns</span>
                `;
                msg.appendChild(metrics);

                // Add Regenerate button
                const regenBtn = document.createElement('button');
                regenBtn.className = 'regenerate-btn';
                regenBtn.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                    Regenerate
                `;
                regenBtn.onclick = () => App.regenerate();
                msg.appendChild(regenBtn);

                this.scrollToBottom();
            },

            createMultiAgentContainer(id, domains) {
                const msg = document.getElementById(id);
                const bubble = msg.querySelector('.bubble');
                bubble.innerHTML = '';
                
                const container = document.createElement('div');
                container.className = 'multi-agent-container';
                container.innerHTML = `
                    <div class="multi-agent-header">
                        🧩 Multi-Agent Composition — 
                        ${domains.map(d => `<span class="domain-badge domain-${d.toLowerCase()}">${d.toUpperCase()}</span>`).join(' + ')}
                    </div>
                    <div class="sub-agent-panels">
                        ${domains.map((d, i) => `
                            <div class="sub-agent-panel" id="panel-${id}-${i}">
                                <div class="sub-agent-panel-header">
                                    <span class="domain-badge domain-${d.toLowerCase()}">${d.toUpperCase()}</span>
                                    <span class="sub-agent-status" id="status-${id}-${i}">Waiting...</span>
                                </div>
                                <div class="sub-agent-content message-content" id="content-${id}-${i}"></div>
                            </div>
                        `).join('')}
                    </div>`;
                bubble.appendChild(container);
                this.scrollToBottom();
            },

            updateSubAgentStatus(id, index, status) {
                const statusEl = document.getElementById(`status-${id}-${index}`);
                if (statusEl) statusEl.textContent = status;
            },

            appendSubAgentToken(id, index, token) {
                const contentEl = document.getElementById(`content-${id}-${index}`);
                if (!contentEl) return;
                contentEl.dataset.raw = (contentEl.dataset.raw || '') + token;
                contentEl.innerHTML = this.renderMarkdown(contentEl.dataset.raw);
                
                // Highlight code blocks
                contentEl.querySelectorAll('.code-block code:not(.hljs-highlighted)').forEach((block) => {
                    if (!block.textContent.includes('%%')) {
                        hljs.highlightElement(block);
                        block.classList.add('hljs-highlighted');
                    }
                });
                this.scrollToBottom();
            },

            updateSidebar(status) {
                const list = document.getElementById('specialist-status');
                list.innerHTML = '';
                
                for (const [domain, info] of Object.entries(status.specialists)) {
                    const item = document.createElement('div');
                    item.className = 'specialist-item';
                    const state = info.active ? 'active' : (info.cached ? 'cached' : 'none');
                    item.innerHTML = `
                        <div class="status-dot ${state}"></div>
                        <span>${domain.charAt(0).toUpperCase() + domain.slice(1)}</span>
                    `;
                    list.appendChild(item);
                }

                document.getElementById('stat-queries').textContent = status.session_stats.total_queries;
                const hitRate = (status.session_stats.cache_hits / status.session_stats.total_queries * 100) || 0;
                document.getElementById('stat-cache').textContent = hitRate.toFixed(0) + '%';
                document.getElementById('stat-saved').textContent = Math.max(0, status.session_stats.total_queries - 1);
                document.getElementById('stat-context').textContent = `${status.context_turns}/${status.max_history}`;
            },

            scrollToBottom() {
                this.container.scrollTop = this.container.scrollHeight;
            },

            renderMarkdown(text) {
                // Step 1: extract and replace code blocks with placeholders
                const codeBlocks = [];
                // Handle closed blocks
                let processed = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
                    const index = codeBlocks.length;
                    codeBlocks.push({ lang: lang || 'plaintext', code: code });
                    return `%%CODEBLOCK_${index}%%`;
                });
                // Handle unclosed block at the end
                processed = processed.replace(/```(\w*)\n?([\s\S]*)$/g, (match, lang, code) => {
                    const index = codeBlocks.length;
                    codeBlocks.push({ lang: lang || 'plaintext', code: code });
                    return `%%CODEBLOCK_${index}%%`;
                });

                // Step 2: basic markdown — bold, italic, inline code
                processed = processed
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\n/g, '<br>');

                // Step 3: restore code blocks as proper HTML
                processed = processed.replace(/%%CODEBLOCK_(\d+)%%/g, (match, index) => {
                    const { lang, code } = codeBlocks[parseInt(index)];
                    const escapedCode = code
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    const blockId = `code-${Date.now()}-${index}`;
                    return `
                        <div class="code-block">
                            <div class="code-block-header">
                                <span class="lang-label">${lang}</span>
                                <button class="copy-btn" onclick="UI.copyCode('${blockId}')">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                    </svg>
                                    Copy
                                </button>
                            </div>
                            <pre><code id="${blockId}" class="language-${lang}">${escapedCode}</code></pre>
                        </div>`;
                });

                return processed;
            },

            copyCode(blockId) {
                const codeEl = document.getElementById(blockId);
                if (!codeEl) return;
                navigator.clipboard.writeText(codeEl.innerText).then(() => {
                    const btn = codeEl.closest('.code-block').querySelector('.copy-btn');
                    btn.classList.add('copied');
                    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
                    }, 2000);
                });
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        };

        // 3. App Controller
        const App = {
            isStreaming: false,
            abortController: null,
            lastPrompt: '',

            async init() {
                this.bindEvents();
                await this.refreshStatus();
                setInterval(() => this.refreshStatus(), 3000);
            },

            bindEvents() {
                UI.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                UI.input.addEventListener('input', () => {
                    UI.input.style.height = 'auto';
                    UI.input.style.height = (UI.input.scrollHeight) + 'px';
                });
            },

            async sendMessage(customPrompt) {
                const prompt = customPrompt || UI.input.value.trim();
                if (!prompt || this.isStreaming) return;

                this.isStreaming = true;
                this.lastPrompt = prompt;
                this.abortController = new AbortController();

                UI.input.value = '';
                UI.input.style.height = 'auto';
                UI.input.disabled = true;
                
                UI.sendBtn.style.display = 'none';
                UI.stopBtn.style.display = 'flex';

                UI.addUserMessage(prompt);
                const bubbleId = UI.addTypingIndicator();

                await API.streamQuery(prompt, {
                    onRouting: (event) => {
                        UI.upgradeToBubble(bubbleId, event.domain);
                    },
                    onLoaded: (event) => {},
                    onToken: (event) => {
                        UI.appendToken(bubbleId, event.content);
                    },
                    onMultiAgentStart: (event) => {
                        UI.createMultiAgentContainer(bubbleId, event.domains);
                    },
                    onSubAgentStart: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, "Starting...");
                    },
                    onSubAgentLoaded: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, `Loaded in ${event.load_time}s`);
                    },
                    onSubAgentToken: (event) => {
                        UI.appendSubAgentToken(bubbleId, event.index, event.content);
                    },
                    onSubAgentDone: (event) => {
                        UI.updateSubAgentStatus(bubbleId, event.index, `Done (${event.inference_time}s)`);
                    },
                    onDone: (event) => {
                        UI.finalizeMessage(bubbleId, event);
                        this.finishStreaming();
                        this.refreshStatus();
                    },
                    onError: (err) => {
                        if (err === 'AbortError') return; 
                        console.error("Stream error:", err);
                        const msg = document.getElementById(bubbleId);
                        if (msg) msg.querySelector('.bubble').innerHTML = `<span style="color: #ff5252">Error: ${err}</span>`;
                        this.finishStreaming();
                    }
                }, this.abortController.signal);
            },

            stopGeneration() {
                if (this.abortController) {
                    this.abortController.abort();
                    this.finishStreaming();
                }
            },

            finishStreaming() {
                this.isStreaming = false;
                this.abortController = null;
                UI.input.disabled = false;
                UI.sendBtn.style.display = 'flex';
                UI.stopBtn.style.display = 'none';
                UI.input.focus();
            },

            regenerate() {
                if (this.lastPrompt && !this.isStreaming) {
                    this.sendMessage(this.lastPrompt);
                }
            },

            async refreshStatus() {
                try {
                    const status = await API.getStatus();
                    UI.updateSidebar(status);
                } catch (e) { console.error("Status check failed", e); }
            },

            async clearContext() {
                if (confirm("Clear conversation context?")) {
                    await API.clearContext();
                    UI.container.innerHTML = '';
                    await this.refreshStatus();
                }
            }
        };

        App.init();
    </script>
</body>
</html>
